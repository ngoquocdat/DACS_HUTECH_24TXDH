name: Temporary lockfile repair (thesis branch)
on:
  push:
    branches: [feature/thesis-final-aws-foundation]
    paths: [.github/workflows/repair-frontend-lock.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Reconcile frontend lockfile
        working-directory: ipos-pokesaigon/frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated frontend lockfile to this feature branch only
        run: |
          git add ipos-pokesaigon/frontend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(frontend): reconcile npm lockfile for reproducible CI [skip ci]"
          git push origin HEAD:feature/thesis-final-aws-foundation
