name: Thesis CI - Frontend and Backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    defaults:
      run:
        working-directory: ipos-pokesaigon/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ipos-pokesaigon/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
