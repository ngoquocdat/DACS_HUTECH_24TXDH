AWSTemplateFormatVersion: '2010-09-09'
Description: Thesis iPOS UAT bootstrap - restricted CI roles, private artifacts and CloudFront frontend
Parameters:
  GitHubDeployRoleName:
    Type: String
    Default: 'HUTECH-GitHub-UAT-DeployRole.'
    Description: Name of existing GitHub OIDC role (including legacy trailing period).
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'thesis-pokesaigon-uat-artifacts-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: AbortMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'thesis-pokesaigon-uat-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Signed access from CloudFront to private UAT frontend bucket
        Name: !Sub 'thesis-uat-web-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Thesis Pokesaigon UAT SPA
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: UatS3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: UatS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          DefaultTTL: 0
          MinTTL: 0
          MaxTTL: 300
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOACReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: thesis-pokesaigon-uat-lambda-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UatOrdersAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UatDynamoItems
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan, dynamodb:Query]
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/pokesaigon-orders-uat'
              - Sid: UatLambdaLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/pokesaigon-api-uat:*'
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: thesis-pokesaigon-uat-cfn-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: UatAppProvisioning
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UatLambdaResource
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pokesaigon-api-uat'
              - Sid: UatDynamoTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DeleteTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/pokesaigon-orders-uat'
              - Sid: CognitoPoolAndApiProvisioning
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:CreateGroup
                  - cognito-idp:UpdateGroup
                  - cognito-idp:DeleteGroup
                  - cognito-idp:GetGroup
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource: '*'
              - Sid: PassOnlyUatLambdaRuntime
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RuntimeRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
  DeployRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ThesisUatDeploy
      Roles: [!Ref GitHubDeployRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DescribeUatStack
            Effect: Allow
            Action: [cloudformation:DescribeStacks, cloudformation:ListStackResources, cloudformation:GetTemplate, cloudformation:DescribeStackEvents]
            Resource:
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/thesis-pokesaigon-uat/*'
              - !Ref AWS::StackId
          - Sid: UatChangeSet
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListChangeSets
            Resource:
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/thesis-pokesaigon-uat/*'
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
          - Sid: UatStackLifecycle
            Effect: Allow
            Action: [cloudformation:CreateStack, cloudformation:UpdateStack]
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/thesis-pokesaigon-uat/*'
          - Sid: ReadBootstrapOutputs
            Effect: Allow
            Action: [cloudformation:DescribeStacks]
            Resource: !Ref AWS::StackId
          - Sid: ArtifactBucketMetadata
            Effect: Allow
            Action: [s3:GetBucketLocation, s3:ListBucket]
            Resource: !GetAtt ArtifactBucket.Arn
          - Sid: ArtifactObjectActions
            Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub '${ArtifactBucket.Arn}/*'
          - Sid: FrontendBucketMetadata
            Effect: Allow
            Action: [s3:ListBucket]
            Resource: !GetAtt WebBucket.Arn
          - Sid: FrontendPublish
            Effect: Allow
            Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
            Resource: !Sub '${WebBucket.Arn}/*'
          - Sid: CloudFrontInvalidation
            Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
          - Sid: PassOnlyUatCfnRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
Outputs:
  ArtifactBucketName: {Value: !Ref ArtifactBucket}
  FrontendBucketName: {Value: !Ref WebBucket}
  FrontendOrigin:
    Value: !Sub 'https://${WebDistribution.DomainName}'
  FrontendDistributionId: {Value: !Ref WebDistribution}
  RuntimeRoleArn: {Value: !GetAtt RuntimeRole.Arn}
  CloudFormationExecutionRoleArn: {Value: !GetAtt CloudFormationExecutionRole.Arn}
