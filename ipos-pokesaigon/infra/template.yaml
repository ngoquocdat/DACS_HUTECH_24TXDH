AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: iPOS Pokesaigon thesis UAT/prod infrastructure baseline (requires authentication before public release)
Parameters:
  Environment:
    Type: String
    Default: uat
    AllowedValues: [uat, prod]
  CorsOrigin:
    Type: String
    Description: Exact trusted HTTPS frontend origin
    AllowedPattern: '^https://[^/]+$'
  SnsTopicArn:
    Type: String
    Default: ''
Conditions:
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]
  IsProduction: !Equals [!Ref Environment, prod]
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref OrdersTable
        CORS_ORIGIN: !Ref CorsOrigin
        SNS_NEW_ORDER_TOPIC_ARN: !Ref SnsTopicArn
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'pokesaigon-orders-${Environment}'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
  OrderApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pokesaigon-api-${Environment}'
      CodeUri: ../backend/
      Handler: dist/handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan, dynamodb:Query]
              Resource: !GetAtt OrdersTable.Arn
        - !If
          - HasSnsTopic
          - Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref SnsTopicArn
          - !Ref AWS::NoValue
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref OrdersApi
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            ApiId: !Ref OrdersApi
  OrdersApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref CorsOrigin]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        MaxAge: 300
Outputs:
  ApiUrl:
    Value: !Sub 'https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com'
  OrdersTableName:
    Value: !Ref OrdersTable
  LambdaFunctionArn:
    Value: !GetAtt OrderApiFunction.Arn
